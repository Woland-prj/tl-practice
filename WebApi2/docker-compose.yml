services:
  postgres:
    image: postgres:16
    container_name: webapi2-postgres
    environment:
      POSTGRES_USER: webapi
      POSTGRES_PASSWORD: webapi_pass
      POSTGRES_DB: webapi2
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
